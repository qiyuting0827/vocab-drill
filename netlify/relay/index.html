<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>同步服务 · 单词默写</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f5f6f8;
        --card: #ffffff;
        --text: #1c2128;
        --muted: #6b7280;
        --primary: #2563eb;
        --line: #e4e7ec;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1116;
          --card: #161b22;
          --text: #e6e9ef;
          --muted: #98a2b3;
          --primary: #6ea0ff;
          --line: #262d38;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        line-height: 1.6;
      }
      .card {
        width: 100%;
        max-width: 420px;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
        text-align: center;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 6px;
        border-radius: 50%;
        background: #15803d;
        vertical-align: 1px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
      }
      p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 14px;
      }
      a {
        display: inline-block;
        padding: 11px 18px;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      code {
        font-size: 12px;
        color: var(--muted);
        word-break: break-all;
      }
      footer {
        margin-top: 18px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1><span class="dot"></span>同步服务运行中</h1>
      <p>
        本地址只提供单词默写的云同步接口，不提供练习页面。<br />
        学员名单、历史记录和错题本仍会正常同步。
      </p>
      <a href="https://qiyuting0827.github.io/vocab-drill/">打开单词默写</a>
      <p style="margin: 16px 0 0">
        <code>/.netlify/functions/sync</code>
      </p>
      <footer>乐智托管 · 亓老师制作</footer>
    </main>
  </body>
</html>
