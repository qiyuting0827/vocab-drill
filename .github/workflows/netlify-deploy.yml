name: Trigger Netlify deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify build hook
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "NETLIFY_BUILD_HOOK 未配置，跳过。"
            exit 0
          fi
          status=$(curl -sS -o /tmp/netlify-hook.out -w "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' "$NETLIFY_BUILD_HOOK")
          echo "Netlify build hook HTTP $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Netlify 构建触发失败。"
            exit 1
          fi
          echo "Netlify 构建已触发。"
